name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  go:
    name: Go build / vet / test / lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [lambda/ingest, lambda/query, scripts/register]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.x

      - name: Prepare OpenTofu provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: tofu-${{ runner.os }}-

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: lambda/ingest/go.sum

      - name: Init
        run: tofu init -backend=false

      - name: Format check
        run: tofu fmt -check -diff

      - name: Validate
        run: tofu validate

      - name: Test
        run: tofu test

  integration:
    name: LocalStack integration
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - "4566:4566"
        env:
          SERVICES: s3,dynamodb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Ingest integration
        working-directory: lambda/ingest
        run: go test -tags=integration -race ./...
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-northeast-2
  artifact:
    name: Lambda deployment artifact
    runs-on: ubuntu-latest
    needs: [go, tofu, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build deployable Lambda artifact
        run: ./scripts/build-lambdas.sh
      - name: Package
        run: |
          ./scripts/build-lambdas.sh
          sha256sum lambda/ingest/function.zip > lambda/ingest/function.zip.sha256
      - name: Upload deployment artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ github.sha }}
          path: |
            lambda/ingest/function.zip
            lambda/ingest/function.zip.sha256
          if-no-files-found: error
          retention-days: 30
