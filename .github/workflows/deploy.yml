name: Deploy release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
      skip_smoke:
        description: Allow only the first bootstrap before smoke secrets exist
        required: true
        default: false
        type: boolean

concurrency:
  group: serverless-error-ingest-${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
    steps:
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .tag_name)" = "$RELEASE_TAG"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          if [[ "$type" = tag ]]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha')
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.x
          tofu_wrapper: false

      - name: Prepare OpenTofu provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: tofu-${{ runner.os }}-

      - name: Resolve successful CI artifact
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          run_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success&event=push&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | last | .id')
          if [[ -z "$run_id" || "$run_id" = null ]]; then
            echo "No successful push CI run found for $RELEASE_SHA; rerun CI or release a fresh reviewed commit." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified Lambda artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f lambda/ingest/function.zip lambda/ingest/function.zip.sha256
          if ! gh run download "${{ steps.ci.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "lambda-${{ steps.release.outputs.sha }}" \
            --dir .; then
            echo "The exact-SHA Lambda artifact is missing or expired; rerun CI or release a fresh reviewed commit." >&2
            exit 1
          fi
          sha256sum --check lambda/ingest/function.zip.sha256

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: error-ingest-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "${{ vars.AWS_ACCOUNT_ID }}"

      - name: Initialize OpenTofu
        working-directory: infra
        run: >-
          tofu init -reconfigure
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=$AWS_REGION"
          -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"
          -backend-config="encrypt=true"

      - name: Create and apply saved plan
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_raw_bucket_name: ${{ vars.RAW_BUCKET_NAME }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_dns_provider: ${{ vars.DNS_PROVIDER }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          tofu plan -no-color -lock-timeout=5m -var-file=production.tfvars.example -out=tfplan | tee plan.log
          tail -n 80 plan.log >> "$GITHUB_STEP_SUMMARY"
          tofu apply -auto-approve tfplan

      - name: Read deployment outputs
        id: outputs
        working-directory: infra
        run: |
          echo "public_base_url=$(tofu output -raw public_base_url)" >> "$GITHUB_OUTPUT"
          echo "raw_bucket=$(tofu output -raw raw_bucket)" >> "$GITHUB_OUTPUT"
          echo "events_table=$(tofu output -raw events_table)" >> "$GITHUB_OUTPUT"

      - name: Verify POST persistence
        if: github.event_name != 'workflow_dispatch' || inputs.skip_smoke != true
        env:
          PUBLIC_BASE_URL: ${{ steps.outputs.outputs.public_base_url }}
          RAW_BUCKET: ${{ steps.outputs.outputs.raw_bucket }}
          EVENTS_TABLE: ${{ steps.outputs.outputs.events_table }}
          SMOKE_PROJECT_ID: ${{ secrets.SMOKE_PROJECT_ID }}
          SMOKE_PUBLIC_KEY: ${{ secrets.SMOKE_PUBLIC_KEY }}
        run: ./scripts/smoke-ingest.sh

      - name: Deployment summary
        run: |
          echo "## Error ingest release deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: ${{ steps.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ steps.release.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Endpoint: ${{ steps.outputs.outputs.public_base_url }}" >> "$GITHUB_STEP_SUMMARY"
